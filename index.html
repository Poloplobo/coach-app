<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Rugby Tracker — RNR</title>
    <link rel="preload" as="image" href="/splash-clair.webp" />
    <!-- Écran d'ouverture en HTML/CSS pur : visible avant le chargement du JS (la CSP interdit les scripts en ligne).
         Le logo apparaît, puis grandit en s'effaçant pour laisser place à l'app ; main.tsx retire ensuite l'élément. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #fff;
        pointer-events: none; animation: splash-out 420ms cubic-bezier(0.4, 0, 1, 1) 900ms both; }
      #splash img { width: min(72vw, 400px); height: auto;
        animation: splash-in 480ms cubic-bezier(0.2, 0.8, 0.2, 1) both, splash-grow 420ms cubic-bezier(0.4, 0, 1, 1) 900ms forwards; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.88); } }
      @keyframes splash-grow { to { transform: scale(1.7); } }
      @keyframes splash-out { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
        #splash { animation-duration: 200ms; animation-delay: 500ms; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/splash-clair.webp" alt="" width="1008" height="851" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
